name: Homelab - Test and image

# Fork-only workflow. The homelab branch merges our feature branches on top of
# upstream main; every push is tested and published to GHCR for the cluster.
# Not meant for upstream: feature branches are cut from main without this file.

on:
  push:
    branches: [homelab]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homelab-image
  cancel-in-progress: true

jobs:
  test:
    name: Vet and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Build the web app
        run: make ui
      - name: Check the web app
        run: |
          npm --prefix app/frontend run check
          npm --prefix app/frontend run test
      - name: Vet
        run: go vet ./...
      - name: Layer rules
        run: go test -tags structure ./app/backend/tools/structurecheck
      - name: Test
        # Upstream has a few load-sensitive tests (busy answers, poller timing).
        # A package that fails is run once more on its own; a real failure fails twice.
        run: |
          set -o pipefail
          if go test -timeout 30m ./... 2>&1 | tee test.log; then exit 0; fi
          failed=$(grep -E '^FAIL[[:space:]]+github.com/' test.log | awk '{print $2}' | sort -u)
          [ -n "$failed" ] || exit 1
          echo "::warning::re-running failed packages once: $failed"
          go test -count=1 -timeout 30m $failed

  image:
    name: Build and push to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Version
        id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)-homelab.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/eddoww/holyarrs:homelab
            ghcr.io/eddoww/holyarrs:${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Digest
        run: echo "ghcr.io/eddoww/holyarrs:${{ steps.v.outputs.version }}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
